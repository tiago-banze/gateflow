<!-- Open Graph / Twitter Card — controla como o link aparece quando é
     partilhado no WhatsApp, Facebook, etc. (título, descrição, imagem).
     Cada página pode personalizar definindo as variáveis og_title e
     og_description (via {% raw %}{% set %}{% endraw %}) ANTES de incluir este parcial. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="GateFlow" />
<meta property="og:title" content="{{ og_title | default('GateFlow — Bilheteira e Check-in por QR Code') }}" />
<meta property="og:description" content="{{ og_description | default('Venda os teus bilhetes online com pagamento M-Pesa e valida a entrada dos convidados em segundos, com leitura de QR Code em tempo real.') }}" />
<meta property="og:url" content="{{ request.url }}" />
{% if gateflow_logo_available %}
<meta property="og:image" content="{{ url_for('serve_asset', filename='favicon-512.png', _external=True) }}" />
<meta property="og:image:width" content="512" />
<meta property="og:image:height" content="512" />
{% endif %}
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ og_title | default('GateFlow — Bilheteira e Check-in por QR Code') }}" />
<meta name="twitter:description" content="{{ og_description | default('Venda os teus bilhetes online com pagamento M-Pesa e valida a entrada dos convidados em segundos.') }}" />
