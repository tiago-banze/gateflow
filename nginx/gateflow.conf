# ==============================================================================
# nginx/gateflow.conf
# Reverse proxy de producao para o GateFlow (Gunicorn escutando em 127.0.0.1:8000)
#
# Instalacao:
#   sudo cp nginx/gateflow.conf /etc/nginx/sites-available/gateflow.conf
#   sudo ln -s /etc/nginx/sites-available/gateflow.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Os certificados SSL abaixo assumem Let's Encrypt via certbot:
#   sudo certbot --nginx -d gateflow.co.mz -d www.gateflow.co.mz
# ==============================================================================

# Redireciona todo trafego HTTP para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name gateflow.co.mz www.gateflow.co.mz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateflow.co.mz www.gateflow.co.mz;

    ssl_certificate     /etc/letsencrypt/live/gateflow.co.mz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateflow.co.mz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cabecalhos de seguranca
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 15m;   # acompanha config.MAX_UPLOAD_SIZE_BYTES (planilhas de convidados, logos)

    access_log /var/log/nginx/gateflow.access.log;
    error_log  /var/log/nginx/gateflow.error.log;

    # Arquivos estaticos servidos diretamente pelo Nginx (mais rapido que passar pelo Gunicorn)
    location /static/ {
        alias /opt/gateflow/checkin_system/frontend/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        alias /opt/gateflow/checkin_system/backend/assets/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Webhook do M-Pesa: sem buffering, para nao atrasar a confirmacao de pagamento
    location /api/mpesa/callback {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;   # acompanha o timeout do USSD Push M-Pesa no Gunicorn
        proxy_connect_timeout 10s;
    }
}
